              - { label: "Sandy bottom (underwater)", value: "sandy-bottom" }
              - { label: "Sunken anchor (underwater)", value: "sunken-anchor" }
          - label: "Sky decoration — left"
            name: "sky_left"
            widget: "select"
            required: false
            default: ""
            options:
              - { label: "— None —",          value: "" }
              - { label: "Sun (large)",       value: "sun" }
              - { label: "Sun (small)",       value: "sun-small" }
              - { label: "Crescent moon",     value: "moon-crescent" }
              - { label: "Full moon",         value: "moon-full" }
              - { label: "Cloud (soft)",      value: "cloud-soft" }
              - { label: "Cloud (wisps)",     value: "cloud-wisp" }
              - { label: "Hot air balloon",   value: "hot-air-balloon" }
              - { label: "Flying birds",      value: "flying-birds" }
              - { label: "Light rays — strong (underwater)", value: "light-rays-strong" }
              - { label: "Light rays — soft (underwater)",   value: "light-rays-soft" }
          - label: "Sky decoration — center"
            name: "sky_center"
            widget: "select"
            required: false
            default: ""
            options:
              - { label: "— None —",                value: "" }
              - { label: "Sun (large)",             value: "sun" }
              - { label: "Sun (small)",             value: "sun-small" }
              - { label: "Crescent moon",           value: "moon-crescent" }
              - { label: "Full moon",               value: "moon-full" }
              - { label: "Cloud (soft)",            value: "cloud-soft" }
              - { label: "Twinkling stars",         value: "twinkling-stars" }
              - { label: "Aurora band",             value: "aurora-band" }
              - { label: "Flying birds",            value: "flying-birds" }
              - { label: "Hot air balloon",         value: "hot-air-balloon" }
          - label: "Sky decoration — right"
            name: "sky_right"
            widget: "select"
            required: false
            default: ""
            options:
              - { label: "— None —",          value: "" }
              - { label: "Sun (large)",       value: "sun" }
              - { label: "Sun (small)",       value: "sun-small" }
              - { label: "Crescent moon",     value: "moon-crescent" }
              - { label: "Full moon",         value: "moon-full" }
              - { label: "Cloud (soft)",      value: "cloud-soft" }
              - { label: "Cloud (wisps)",     value: "cloud-wisp" }
              - { label: "Hot air balloon",   value: "hot-air-balloon" }
              - { label: "Flying birds",      value: "flying-birds" }
          - label: "Atmosphere overlays (effects on top)"
            name: "atmosphere"
            widget: "select"
            multiple: true
            required: false
            default: []
            options:
              - { label: "❄️  Falling snow",     value: "snow" }
              - { label: "🌧 Falling rain",      value: "rain" }
              - { label: "🌫 Fog drifting",      value: "fog" }
              - { label: "✨ Fireflies",          value: "fireflies" }
              - { label: "🫧 Rising bubbles (underwater)",   value: "bubbles" }
              - { label: "✦ Drifting plankton (underwater)", value: "particles" }

  # ─── Site-wide settings (editable from the CMS sidebar) ───
  - name: "settings"
    label: "⚙️ Site Settings"
    files:
      - label: "Profile & General"
        name: "general"
        file: "src/_data/settings.json"
        fields:
          - { label: "Profile Photo", name: "profilePhoto", widget: "image", hint: "Your profile picture shown on the home page and about page." }
          - label: "Instagram"
            name: "instagram"
            widget: "object"
            fields:
              - { label: "Handle", name: "handle", widget: "string", hint: "e.g. @pumpkin.travels" }
              - { label: "URL", name: "url", widget: "string", hint: "e.g. https://instagram.com/pumpkin.travels" }
          - label: "YouTube"
            name: "youtube"
            widget: "object"
            fields:
              - { label: "Handle", name: "handle", widget: "string", hint: "e.g. @pumpkintravels" }
              - { label: "URL", name: "url", widget: "string", hint: "e.g. https://youtube.com/@pumpkintravels" }
          - label: "TikTok"
            name: "tiktok"
            widget: "object"
            fields:
              - { label: "Handle", name: "handle", widget: "string", hint: "e.g. @pumpkin.travels" }
              - { label: "URL", name: "url", widget: "string", hint: "e.g. https://tiktok.com/@pumpkin.travels" }

  # ─── Read-only message inbox would go here later if we want ───
